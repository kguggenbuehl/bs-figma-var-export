<!DOCTYPE html>
<html>

<head>
	<style>
		body {
			font-family: Inter, sans-serif;
			margin: 16px;
		}
		textarea {
			width: 100%;
			height: 580px;
			font-family: monospace;
			font-size: 12px;
		}
		.controls {
			margin-block: 20px;
			display: flex;
			align-items: center;
			gap: 8px;
		}
		button {
			margin-inline-start: auto;
			padding: 5px 10px;
			background-color: #bada55;
			border: 0;
			border-radius: 4px;
		}
		button:hover {
			background-image: linear-gradient(to top, hsl(0 0% 0% / 0.1));
			cursor: pointer;
		}
	</style>
</head>

<body>

	<div class="controls">
		<label for="darkModeToggle"><input type="checkbox" id="darkModeToggle">Dark Mode berücksichtigen</label>
		<button id="copy">Copy CSS</button>
	</div>

	<textarea id="output"></textarea>
	

	<script>

		const darkModeToggle = document.getElementById("darkModeToggle");

		// request export from plugin code
		function requestExport() {
			parent.postMessage({
				pluginMessage: {
					type: "EXPORT_REQUEST",
					includeDarkMode: darkModeToggle.checked
				}
			}, "*");
		}

		// show messages
		window.onmessage = event => {
			const message = event.data.pluginMessage;

			if (message.type === "EXPORT") {
				document.getElementById("output").value = message.css;
			}
		};

		// re-export when checkbox changes
		darkModeToggle.addEventListener("change", requestExport);

		// initial export on load
		requestExport();

		// copy CSS function
		document.getElementById("copy").addEventListener("click", async () => {

			const text = output.value || output.textContent;

			try {
				if (navigator.clipboard && window.isSecureContext) {
					await navigator.clipboard.writeText(text);
				} else {
					output.select();
					document.execCommand("copy");
				}
				console.log("Text wurde kopiert");
			} catch (error) {
				console.error("Kopieren fehlgeschlagen:", error);
			}
		}
		);
	</script>

</body>

</html>
